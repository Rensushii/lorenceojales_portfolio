<div class="hero-section-wrapper">
    <div class="hero-aurora-layer"></div>
    <div class="hero-spotlight-overlay"></div>
    <div class="hero-float-orb orb-1"></div>
    <div class="hero-float-orb orb-2"></div>
    <div class="hero-float-orb orb-3"></div>
    <div class="hero-flex">
        <div class="hero-text-col">
            <h1 class="hero-name-premium"><span class="gradient-text">Lorence B. Ojales</span></h1>
            <div class="role-switcher-wrapper">
                <span class="role-switcher-inner" id="roleSwitcherText"></span>
                <span class="role-switcher-cursor"></span>
            </div>
            <p class="hero-desc-premium">
                Designing <strong>intelligent systems</strong>, building <strong>embedded solutions</strong>, and creating
                <strong>innovative technologies</strong> that bridge hardware and software.
            </p>
            <div class="hero-spec-badges">
                <span class="spec-badge"><span class="spec-dot cyan"></span> Computer Engineering</span>
                <span class="spec-badge"><span class="spec-dot blue"></span> Embedded Systems</span>
                <span class="spec-badge"><span class="spec-dot indigo"></span> IoT</span>
                <span class="spec-badge"><span class="spec-dot emerald"></span> Robotics</span>
                <span class="spec-badge"><span class="spec-dot gold"></span> Software Dev</span>
            </div>
            <div class="hero-cta-premium">
                <span class="magnetic-wrap" data-magnetic>
                    <a href="#" data-section="projects" class="btn-premium primary"><i class="fas fa-code"></i> View Projects</a>
                </span>
                <span class="magnetic-wrap" data-magnetic>
                    <a href="#" class="btn-premium secondary" id="resumeViewBtn"><i class="fas fa-file-lines"></i> View Resume</a>
                </span>
            </div>
        </div>
        <div class="hero-reveal-col" id="canvasContainer">
            <canvas id="lightraysCanvas"></canvas>
            <canvas id="webglCanvas"></canvas>
            <img src="images/profile/barong.png" alt="Lorence Ojales" class="hero-mobile-fallback" loading="lazy">
        </div>
    </div>
</div>
<script>
    // Initialize typewriter and canvas after DOM ready
    (function() {
        // Role switcher
        const roleEl = document.getElementById('roleSwitcherText');
        if (roleEl) {
            const roles = ['Computer Engineer', 'Embedded Systems Developer', 'IoT & Robotics Enthusiast', 'Full-Stack Developer'];
            let idx = 0, text = '', typing = true, pause = false;
            const type = () => {
                if (!roleEl) return;
                const full = roles[idx];
                if (text.length < full.length) {
                    text += full[text.length];
                    roleEl.textContent = text;
                    setTimeout(type, 80);
                } else {
                    setTimeout(() => {
                        // delete
                        const del = () => {
                            if (text.length > 0) {
                                text = text.slice(0, -1);
                                roleEl.textContent = text;
                                setTimeout(del, 40);
                            } else {
                                idx = (idx + 1) % roles.length;
                                setTimeout(type, 300);
                            }
                        };
                        setTimeout(del, 1500);
                    }, 1000);
                }
            };
            type();
        }
        // Resume button
        document.getElementById('resumeViewBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.openModal && window.openModal('modal-resume');
        });
        // Magnetic hover (desktop)
        if (!window.isMobile) {
            document.querySelectorAll('.magnetic-wrap[data-magnetic]').forEach(wrap => {
                wrap.addEventListener('mousemove', (e) => {
                    const rect = wrap.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width/2;
                    const y = e.clientY - rect.top - rect.height/2;
                    wrap.style.transform = `translate(${x*0.18}px, ${y*0.18}px)`;
                });
                wrap.addEventListener('mouseleave', () => wrap.style.transform = 'translate(0,0)');
            });
        }
    })();
</script>
