<div class="image-lightbox" id="imageLightbox">
  <button class="image-lightbox-close" id="lightboxClose" aria-label="Close lightbox"><i class="fas fa-times"></i></button>
  <button class="image-lightbox-nav prev" id="lightboxPrev" aria-label="Previous image"><i class="fas fa-chevron-left"></i></button>
  <button class="image-lightbox-nav next" id="lightboxNext" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>
  <img src="" alt="Gallery image" id="lightboxImage">
  <span class="image-lightbox-counter" id="lightboxCounter"></span>
</div>

<div class="modal-overlay" id="modal-resume">
  <div class="modal-dialog modal-resume">
    <button class="modal-close" onclick="closeModal('modal-resume')" aria-label="Close resume"><i class="fas fa-times"></i></button>
    <div class="modal-resume-toolbar">
      <h2><i class="fas fa-file-pdf" style="color:var(--accent-cyan); margin-right:6px;"></i>Lorence Ojales — Resume</h2>
      <a href="/resume.pdf" download="Lorence_Ojales_Resume.pdf" class="modal-resume-download-btn" title="Download Resume">
        <i class="fas fa-download"></i> Download PDF
      </a>
    </div>
    <iframe class="modal-resume-iframe" src="/resume.pdf#toolbar=1&navpanes=1&scrollbar=1" title="Lorence Ojales Resume" allowfullscreen></iframe>
  </div>
</div>
